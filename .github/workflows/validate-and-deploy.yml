name: Validate and deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MY_SUB_REFRESH_TOKEN: ${{ secrets.MY_SUB_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci
        working-directory: service
      - name: Validate profile template
        id: validate
        run: node tests/snapshot.mjs && node tests/validate-profile.mjs
      - name: Render static profile for Mihomo
        id: render_mihomo
        run: node tests/render-mihomo-profile.mjs "$RUNNER_TEMP/mihomo-profile.yaml"
      - name: Install Mihomo kernel
        id: install_mihomo
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"
          asset_url="$(jq --raw-output '.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-v[0-9.]+\\.gz$")) | .browser_download_url' <<< "$release_json" | head -n 1)"
          test -n "$asset_url"
          curl --fail --silent --show-error --location "$asset_url" --output "$RUNNER_TEMP/mihomo.gz"
          gzip --decompress "$RUNNER_TEMP/mihomo.gz"
          chmod +x "$RUNNER_TEMP/mihomo"
          echo "path=$RUNNER_TEMP/mihomo" >> "$GITHUB_OUTPUT"
      - name: Prepare Mihomo geodata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mihomo-home"
          curl --fail --silent --show-error --location https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat --output "$RUNNER_TEMP/mihomo-home/GeoSite.dat"
          curl --fail --silent --show-error --location https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat --output "$RUNNER_TEMP/mihomo-home/GeoIP.dat"
          curl --fail --silent --show-error --location https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb --output "$RUNNER_TEMP/mihomo-home/Country.mmdb"
          curl --fail --silent --show-error --location https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb --output "$RUNNER_TEMP/mihomo-home/ASN.mmdb"
      - name: Mihomo kernel validation
        id: mihomo_validate
        run: ${{ steps.install_mihomo.outputs.path }} -d "$RUNNER_TEMP/mihomo-home" -t -f "$RUNNER_TEMP/mihomo-profile.yaml"
      - name: Check deployment credential
        id: credential
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credential is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is missing; validation passed but deployment will be skipped."
          fi
      - name: Deploy Cloudflare Worker
        id: deploy_worker
        if: steps.credential.outputs.available == 'true'
        run: npx wrangler d1 migrations apply general-clash-config --remote && npx wrangler deploy
        working-directory: service
      - name: Check snapshot refresh credential
        id: refresh_credential
        if: steps.deploy_worker.outcome == 'success'
        shell: bash
        run: |
          if [ -n "$MY_SUB_REFRESH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MY_SUB_REFRESH_TOKEN is missing; deployment succeeded and the scheduled refresh will continue to work."
          fi
      - name: Refresh static snapshot
        id: refresh_snapshot
        if: steps.refresh_credential.outputs.available == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $MY_SUB_REFRESH_TOKEN" \
            https://general-clash-config.ermaotie.workers.dev/internal/refresh
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          echo "## 订阅服务发布结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- 配置验证：${{ steps.validate.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mihomo 内核校验：${{ steps.mihomo_validate.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare 凭据：${{ steps.credential.outputs.available == 'true' && '已配置' || '缺少，已跳过部署' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker 部署：${{ steps.deploy_worker.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.deploy_worker.outcome }}" != "success" ]; then
            echo "- 静态快照刷新：未执行（Worker 部署失败）" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.refresh_credential.outputs.available }}" = "true" ]; then
            echo "- 静态快照刷新：${{ steps.refresh_snapshot.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 静态快照刷新：缺少 MY_SUB_REFRESH_TOKEN，已跳过（定时刷新仍可用）" >> "$GITHUB_STEP_SUMMARY"
          fi
