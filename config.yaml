# Portable Mihomo/OpenClash routing template.
# Keep this repository free of subscription URLs, node credentials, and API tokens.
mixed-port: 7890
ipv6: true
allow-lan: true
mode: rule
log-level: warning

dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://dns.google/dns-query

proxy-providers:
  self_hosted:
    type: http
    url: "__SELF_HOSTED_SUBSCRIPTION_URL__"
    path: ./proxy_providers/self_hosted.yaml
    interval: 3600
    health-check: { enable: true, url: "https://www.gstatic.com/generate_204", interval: 600 }

proxy-groups:
  - name: Automatic
    type: url-test
    use: [self_hosted]
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
  - name: Default Proxy
    type: select
    proxies: [Automatic, DIRECT]
    use: [self_hosted]
  - name: AI
    type: select
    proxies: [Automatic, DIRECT]
    use: [self_hosted]
  - name: Media
    type: select
    proxies: [Automatic, DIRECT]
    use: [self_hosted]
  - name: Emby
    type: select
    proxies: [Automatic, DIRECT]
    use: [self_hosted]

rule-providers:
  ads:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.yaml
    path: ./rule_providers/ads.yaml
    interval: 86400
  ai-openai:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml
    path: ./rule_providers/ai-openai.yaml
    interval: 86400
  ai-claude:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.yaml
    path: ./rule_providers/ai-claude.yaml
    interval: 86400
  ai-gemini:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml
    path: ./rule_providers/ai-gemini.yaml
    interval: 86400
  ai-copilot:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.yaml
    path: ./rule_providers/ai-copilot.yaml
    interval: 86400
  media:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-media.yaml
    path: ./rule_providers/media.yaml
    interval: 86400

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN,tv.micu.hk,DIRECT
  - DOMAIN-SUFFIX,oceancloud.asia,Default Proxy
  - DOMAIN-SUFFIX,micu.hk,Default Proxy
  - RULE-SET,ads,REJECT
  # Add Emby hostnames here: DOMAIN-SUFFIX,emby.example.com,Emby
  - RULE-SET,ai-openai,AI
  - RULE-SET,ai-claude,AI
  - RULE-SET,ai-gemini,AI
  - RULE-SET,ai-copilot,AI
  - RULE-SET,media,Media
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,Default Proxy
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,Default Proxy
