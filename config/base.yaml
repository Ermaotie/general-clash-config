# Portable Mihomo/OpenClash routing template.
# Private nodes are injected into a Cloudflare R2 snapshot, never committed here.
mixed-port: 7890
ipv6: true
allow-lan: true
mode: rule
log-level: warning

dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # Hosts that require a real address rather than a synthetic Fake-IP address.
  fake-ip-filter:
    # Home network and local hostnames.
    - "*.lan"
    - "*.local"
    - "+.home.arpa"
    - "router.asus.com"
    # Time synchronisation and certificate validation.
    - "time.*.com"
    - "time.*.apple.com"
    - "time.windows.com"
    - "+.pool.ntp.org"
    - "+.ntp.org.cn"
    - "time1.cloud.tencent.com"
    # Connectivity and captive portal checks.
    - "msftconnecttest.com"
    - "www.msftconnecttest.com"
    - "www.msftncsi.com"
    - "captive.apple.com"
    # cloudflared requires real tunnel endpoint addresses; application hostnames stay on Fake-IP.
    - "+.argotunnel.com"
    - "+.cfargotunnel.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    # Node hostnames resolve through domestic DNS first, independent of proxy availability.
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# Real proxy definitions are injected privately while refreshing the static snapshot.
proxies:
  __PROXIES__
proxy-groups:
  - name: Automatic
    type: url-test
    proxies:
      __SELF_HOSTED_NODE_NAMES__
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
  - name: Manual
    type: select
    proxies:
      __ALL_PROXY_NAMES__
  - name: Default Proxy
    type: select
    proxies:
      __SELF_HOSTED_PROXY_NAMES__
  - name: AI
    type: select
    proxies:
      __SELF_HOSTED_PROXY_NAMES__
  - name: Media
    type: select
    proxies:
      __SELF_HOSTED_PROXY_NAMES__
  - name: Emby
    type: select
    proxies:
      __SELF_HOSTED_PROXY_NAMES__

rule-providers:
  ads:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.yaml
    path: ./rule_providers/ads.yaml
    interval: 86400
  ai-openai:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml
    path: ./rule_providers/ai-openai.yaml
    interval: 86400
  ai-claude:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.yaml
    path: ./rule_providers/ai-claude.yaml
    interval: 86400
  ai-gemini:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml
    path: ./rule_providers/ai-gemini.yaml
    interval: 86400
  ai-copilot:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.yaml
    path: ./rule_providers/ai-copilot.yaml
    interval: 86400
  media:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-media.yaml
    path: ./rule_providers/media.yaml
    interval: 86400
  personal-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://github.com/Ermaotie/general-clash-config/raw/refs/heads/main/config/rules/direct.yaml
    path: ./rule_providers/personal-direct.yaml
    interval: 3600
  personal-proxy:
    type: http
    behavior: classical
    format: yaml
    url: https://github.com/Ermaotie/general-clash-config/raw/refs/heads/main/config/rules/proxy.yaml
    path: ./rule_providers/personal-proxy.yaml
    interval: 3600
  personal-emby:
    type: http
    behavior: classical
    format: yaml
    url: https://github.com/Ermaotie/general-clash-config/raw/refs/heads/main/config/rules/emby.yaml
    path: ./rule_providers/personal-emby.yaml
    interval: 3600

rules:
  # LAN and personal rules always win.
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  # Keep Cloudflare Tunnel's outbound connector off the proxy/TUN path.
  - DOMAIN-SUFFIX,argotunnel.com,DIRECT
  - DOMAIN-SUFFIX,cfargotunnel.com,DIRECT
  - RULE-SET,personal-direct,DIRECT
  - RULE-SET,personal-emby,Emby
  - RULE-SET,personal-proxy,Default Proxy
  - RULE-SET,ads,REJECT

  # Service-specific routes.
  - RULE-SET,ai-openai,AI
  - RULE-SET,ai-claude,AI
  - RULE-SET,ai-gemini,AI
  - RULE-SET,ai-copilot,AI
  - RULE-SET,media,Media
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,Default Proxy

  # Mainland services remain direct; everything else is explicitly proxied.
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,Default Proxy
